name: script_follower_web
description: "Web app per seguire copioni teatrali con riconoscimento vocale"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.0.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  audioplayers: ^5.2.1
  google_fonts: ^4.0.4
  collection: ^1.18.0
  file_picker: ^6.1.1
  syncfusion_flutter_pdf: ^24.1.41
  speech_to_text: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
